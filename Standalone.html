      case "notices":body=`<div class="tools"><input id="noticeQuery" placeholder="Search notices..." aria-label="Search notices"><select id="noticeCategory" aria-label="Filter by category"><option>All categories</option>${[...new Set(notices.map(n=>n.category))].map(x=>`<option>${x}</option>`).join("")}</select><small id="noticeCount">${notices.length} notices</small></div><div class="content" id="noticeResults">${noticeCards(notices)}</div>`;break;

      case "timetable":body=`<section class="card"><div class="card-head"><div><div class="overline">SAMPLE TIMETABLE</div><h3>Weekly class schedule</h3></div><select id="dayFilter"><option>All days</option>${["Mon","Tue","Wed","Thu","Fri"].map(d=>`<option>${d}</option>`).join("")}</select></div><div id="weekTable">${weekTable("All days")}</div></section><section class="card"><div class="overline">UPCOMING DATES</div><h3>Academic calendar</h3>${["02 Dec 2026 · Sample exam period begins","12 Dec 2026 · Illustrative library reminder","18 Dec 2026 · Sample term-end marker"].map(x=>`<div class="event"><b>${x}</b><small>Sample</small></div>`).join("")}</section>`;break;

      case "transport":body=`<section class="card"><div class="overline">ROUTE INFORMATION</div><h3>Sample transport routes</h3>${[["North campus loop","Main gate · Library · Residence area","08:00 AM"],["City connection","Campus hub · Central interchange","08:30 AM"],["Evening return","Campus hub · Main gate","05:15 PM"]].map((r,i)=>`<div class="event"><span class="datebox"><b>0${i+1}</b></span><div style="flex:1"><b>${r[0]}</b><small>${r[1]} · ${r[2]} · sample</small></div><button class="btn" data-action="route" data-route-name="${r[0]}">View route</button></div>`).join("")}<div id="routePreview"></div></section><div class="info">Route names, stops and times are illustrative. Confirm current information through official channels.</div>`;break;
      case "help":body=`<section class="card"><div class="overline">QUICK ANSWERS</div><h3>Frequently asked questions</h3><div class="tools"><input id="faqQuery" placeholder="Search FAQs..." aria-label="Search FAQs"><select id="faqCategory"><option>All topics</option>${[...new Set(faqs.map(f=>f[0]))].map(x=>`<option>${x}</option>`).join("")}</select></div><div id="faqResults">${faqRows(faqs)}</div></section>${requestForm(["Technical issue","Account access guidance","Portal navigation","Other"],"Contact demo desk")}`;break;
      case "profile":body=`<section class="card"><div class="overline">PROFILE DETAILS</div><h3>Sample student profile</h3><div class="detail-grid">${detail("Display name",esc(user.name))}${detail("Programme","B.Tech. Computer Science")}${detail("Academic year","2026 – 2027 · sample")}${detail("Student ID","Not provided in demo")}</div><div class="info">Sample data only. Do not enter real student identifiers or sensitive personal information.</div></section><section class="card"><div class="overline">SAVED IN THIS BROWSER</div><h3>Display preferences</h3><label><input id="compactToggle" type="checkbox" ${preferences.compact?"checked":""}> Compact layout</label><p class="subtle">Reduce spacing across dashboard cards.</p><button class="btn primary" data-action="save-preferences">Save preferences</button><span id="prefMessage"></span></section>`;

  function detail(label,value){return `<div class="detail"><span>${label}</span><b>${value}</b></div>`}
  function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
  function tabButton(id,label,active=false){return `<button class="${active?"active":""}" data-tab="${id}" aria-selected="${active}">${label}</button>`}
  function examTab(tab){if(tab==="admit")return `<div class="overline">DEMO DOCUMENT</div><h3>Admit-card preview</h3><p class="subtle">Illustrative preview · not valid for entry</p><div class="detail-grid">${detail("Student",esc(user.name)+" · demo display name")}${detail("Programme","B.Tech. Computer Science")}${detail("Term","Semester 5 · sample")}${detail("Document status","Unavailable in demo")}</div><button class="btn" disabled>Download unavailable in demo</button>`;if(tab==="results")return `<div class="overline">ILLUSTRATIVE RESULTS</div><h3>No official results are available here</h3><p class="subtle">TaskPath is not connected to examination records and does not invent personal results.</p>`;return `<div class="overline">SAMPLE EXAM SCHEDULE</div><h3>Upcoming exams</h3>${table(["DATE","TIME","SUBJECT","COURSE","VENUE"],[["02 Dec 2026","09:30 AM","Data Structures","CSE205","See official timetable"],["05 Dec 2026","09:30 AM","Design Thinking","INT335","See official timetable"],["09 Dec 2026","02:00 PM","Database Management Systems","CSE202","See official timetable"]])}`}
  function noticeCards(list){return list.length?list.map((n,i)=>`<details class="notice-item"><summary><small>${esc(n.category)} · ${esc(n.date)} · Sample</small>${esc(n.title)}</summary><p>${esc(n.body)}</p></details>`).join(""):'<div class="empty"><b>No notices found</b>Try another keyword or category.</div>'}
  function requestForm(categories=["Academic query","Fee clarification","Hostel support","Transport support","Technical issue","Other"],title="Create a request"){return `<section class="card"><div class="overline">LOCAL DEMO REQUEST</div><h3>${title}</h3><form id="requestForm" class="form-grid" data-categories="${esc(categories.join("|"))}"><label class="field">Request category<select name="category">${categories.map(x=>`<option>${x}</option>`).join("")}</select></label><label class="field">Subject<input name="subject" maxlength="80" placeholder="Briefly describe your request" required></label><label class="field">Details<textarea name="details" maxlength="500" placeholder="Add context. Do not include passwords or sensitive details." required></textarea></label><small>Use sample information only · local browser storage</small><div id="requestMessage" aria-live="polite"></div><button class="btn primary" type="submit">Submit demo request</button></form></section>`}
  function requestTracker(){return `<section class="card"><div class="overline">${requests.length} LOCAL REQUEST${requests.length===1?"":"S"}</div><h3>Request tracker</h3><div id="requestList">${requestRows()}</div></section>`}
  function requestRows(){return requests.length?requests.map(r=>`<div class="request-row"><span class="status">${esc(r.status)}</span><b>${esc(r.subject)}</b><small>${esc(r.category)} · ${esc(r.id)} · ${esc(r.date)}</small></div>`).join(""):'<div class="empty"><b>No demo requests yet</b>Submit a sample request to see it here.</div>'}
  function bookRows(list){return list.length?list.map(b=>`<div class="event"><span class="tile-icon green">B</span><div style="flex:1"><b>${esc(b[0])}</b><small>${esc(b[1])} · ${esc(b[2])} · ${b[3]}</small></div><button class="btn" data-action="book" data-title="${esc(b[0])}">Demo issue</button></div>`).join(""):'<div class="empty"><b>No books found</b>Try a different search or category.</div>'}
  function weekTable(day){const days=["Mon","Tue","Wed","Thu","Fri"],rows=[["09:00 – 10:00","Design Thinking","Data Structures","Discrete Mathematics","Design Thinking","Database Systems"],["10:00 – 11:00","Database Systems","Discrete Mathematics","Data Structures","Database Systems","Design Thinking"],["11:30 – 12:30","Data Structures","Database Systems","Design Thinking","Discrete Mathematics","Data Structures"],["14:00 – 15:00","Tutorial / Lab","Library hour","Tutorial / Lab","Project studio","Open study"]];const visible=days.filter(d=>day==="All days"||d===day);return table(["TIME",...visible],rows.map(r=>[r[0],...visible.map(d=>r[days.indexOf(d)+1])]))}
  function hostelTab(tab){if(tab==="hostelRequest")return `<h3>Hostel support request</h3><p class="subtle">Create a local demo request. It is not sent to staff.</p><button class="btn primary" data-action="hostel-request">Create sample request</button><span id="hostelMessage"></span>`;if(tab==="hostelNotices")return `<h3>Hostel notices · sample</h3><div class="event"><b>Quiet-hours reminder</b><small>Illustrative update</small></div><div class="event"><b>Maintenance contact information</b><small>Sample</small></div>`;return `<div class="overline">ILLUSTRATIVE DETAILS</div><h3>Hostel accommodation</h3><div class="detail-grid">${detail("Residence","Sample residence")}${detail("Room","Details not connected")}${detail("Meal plan","Confirm officially")}${detail("Support status","No live record")}</div>`}
  function faqRows(list){return list.length?list.map(f=>`<details class="faq"><summary>${esc(f[1])}</summary><p>${esc(f[2])}</p></details>`).join(""):'<div class="empty">No matching answers.</div>'}
  function taskPage(id){
    const flow=flows[id];if(!flow)return `<div class="empty"><b>Guided task not found</b>${a("dashboard","Return to overview")}</div>`;
    const step=Number(progress[id]||0),done=completed.includes(id)||step>=flow.steps.length;
    return `<div class="flow">${a("dashboard","← Back to overview","text-link")}<div style="margin:15px 0"><div class="eyebrow">GUIDED TASK · I WANT TO...</div><h1>${done?"Task complete":flow.title}<span class="gold">.</span></h1><p class="subtle">${done?"You’ve reached the end of this illustrative checklist.":flow.intro}</p></div><div class="flow-layout"><section class="card flow-card">${done?`<div class="complete"><div class="check">✓</div><div class="overline">CHECKLIST COMPLETE</div><h2>Nice work. You’re all set.</h2><p class="subtle">${flow.title} guide marked complete. Confirm important details through official systems.</p>${a("portal/"+flow.portal,"Open "+portal(flow.portal)[1],"btn primary")} &nbsp; ${a("dashboard","Return to overview","btn")}</div>`:`<div class="card-head"><div><div class="overline">YOUR CHECKLIST</div><h3>${flow.title}</h3></div><span class="overline">STEP ${step+1} OF ${flow.steps.length}</span></div><div class="progress"><span style="width:${Math.round(step/flow.steps.length*100)}%"></span></div>${flow.steps.map((s,i)=>`<div class="step ${i===step?"current":i<step?"done":""}"><span class="step-num">${i<step?"✓":i+1}</span><div><b>${esc(s[0])}</b>${i<=step?`<p>${esc(s[1])}</p>`:""}${i===step?a("portal/"+flow.portal,"Relevant section: "+portal(flow.portal)[1]+" →","text-link"):""}</div></div>`).join("")}<div class="tools">${button("Previous","previous","btn")}${step<flow.steps.length-1?button("Next step →","next","btn primary"):button("✓ Mark as done","complete","btn primary")}</div>`}</section><aside><div class="stuck"><b>Stuck? Need help?</b><p>Try the relevant portal directly, or look at a quick answer below.</p>${a("portal/help","Visit Help Desk →","text-link")}</div><div class="stuck"><b>Common questions</b>${flow.faqs.map(f=>`<p><b>${esc(f.split("?")[0])}?</b> ${esc(f.split("?").slice(1).join("?").trim())}</p>`).join("")}</div><div class="info">Illustrative instructions only. Verify against actual LPU systems.</div></aside></div></div>`;
  }
  function loginPage(){return `<div class="login"><form class="login-card" id="loginForm"><span class="brand-mark">→</span><div class="eyebrow" style="margin-top:18px">P26 · INT335 DESIGN THINKING</div><h1>Welcome to TaskPath</h1><p>One Student, Seven Portals · Group 9 · Section K3P26YG</p><p>Use a display name to explore. No password is needed or collected.</p><label class="field">Your display name<input name="name" minlength="2" placeholder="e.g. Alex Student" required></label><div id="loginMessage"></div><button class="btn primary" style="margin-top:14px;width:100%">Enter demo →</button><div class="info" style="margin-top:14px">Demo environment only. Never enter an LPU password or real payment details.</div></form></div>`}
  function render(){if(!user){app.innerHTML=loginPage();return}const r=route();if(r.page==="dashboard")shell(dashboard());else if(r.page==="portal")shell(portalPage(r.id));else if(r.page==="task")shell(taskPage(r.id));else location.hash="#dashboard"}
  function updateNoticeFilter(query){const list=notices.filter(n=>n.title.toLowerCase().includes(query.toLowerCase()));const target=document.getElementById("recentNotices");if(target)target.innerHTML=noticeRows(list.slice(0,3))}
  app.addEventListener("input",e=>{
    if(e.target.id==="globalSearch"){searchOpen=true;const wrap=e.target.closest(".search-wrap");const old=wrap.querySelector(".search-results");if(old)old.remove();wrap.insertAdjacentHTML("beforeend",searchResults())}
    if(e.target.id==="noticeFilter")updateNoticeFilter(e.target.value);
    if(e.target.id==="noticeQuery"||e.target.id==="noticeCategory"){const q=document.getElementById("noticeQuery")?.value.toLowerCase()||"",cat=document.getElementById("noticeCategory")?.value||"All categories";const list=notices.filter(n=>(cat==="All categories"||n.category===cat)&&`${n.title} ${n.body} ${n.category}`.toLowerCase().includes(q));document.getElementById("noticeResults").innerHTML=noticeCards(list);document.getElementById("noticeCount").textContent=list.length+" notices"}
    if(e.target.id==="bookQuery"||e.target.id==="bookCategory"){const q=document.getElementById("bookQuery")?.value.toLowerCase()||"",cat=document.getElementById("bookCategory")?.value||"All subjects";const list=books.filter(b=>(cat==="All subjects"||b[2]===cat)&&`${b[0]} ${b[1]}`.toLowerCase().includes(q));document.getElementById("bookResults").innerHTML=bookRows(list);document.getElementById("bookCount").textContent=list.length+" books"}
    if(e.target.id==="faqQuery"||e.target.id==="faqCategory"){const q=document.getElementById("faqQuery")?.value.toLowerCase()||"",cat=document.getElementById("faqCategory")?.value||"All topics";document.getElementById("faqResults").innerHTML=faqRows(faqs.filter(f=>(cat==="All topics"||cat===f[0])&&f.join(" ").toLowerCase().includes(q)))}
  });
  app.addEventListener("change",e=>{
    if(e.target.id==="attendancePeriod"){const recent=e.target.value==="Last 30 days";const values=recent?[[8,7],[10,8],[9,9],[8,7]]:[[28,24],[27,21],[26,24],[27,22]];const tableEl=e.target.closest(".card").querySelector("tbody");if(tableEl)Array.from(tableEl.rows).forEach((row,i)=>{row.cells[1].textContent=values[i][0];row.cells[2].textContent=values[i][1]})}
    if(e.target.id==="dayFilter")document.getElementById("weekTable").innerHTML=weekTable(e.target.value);
    if(e.target.id==="compactToggle"){preferences.compact=e.target.checked;store.set("preferences",preferences)}
  });
  app.addEventListener("click",e=>{
    const routeLink=e.target.closest("a[href^='#']");if(routeLink){searchOpen=false;menu="";return}
    const btn=e.target.closest("[data-action]");if(btn){const action=btn.dataset.action;
      if(action==="mobile"){menu="mobile";render();return}
      if(action==="search-toggle"){searchOpen=!searchOpen;render();document.getElementById("globalSearch")?.focus();return}
      if(action==="close-mobile"){menu="";render();return}
      if(action==="notifications"){menu=menu==="notifications"?"":"notifications";render();return}
      if(action==="profile-menu"){menu=menu==="profile"?"":"profile";render();return}
      if(action==="mark-read"){readNotices=notices.map(n=>n.title);store.set("notifications_read",readNotices);render();return}
      if(action==="logout"){user=null;menu="";store.set("user",null);render();return}
      if(action==="save-preferences"){const ok=store.set("preferences",preferences);const el=document.getElementById("prefMessage");if(el)el.innerHTML=`<small class="message ${ok?"ok":"error"}">${ok?"Preferences saved in this browser.":"Could not save preferences in this browser."}</small>`;return}
      if(action==="route"){const target=document.getElementById("routePreview");if(target)target.innerHTML=`<div class="info">${esc(btn.dataset.routeName)} · Sample stops: Campus hub → Library junction → Residence area → Main gate.</div>`;return}
      if(action==="book"){btn.textContent=btn.textContent==="Demo issue"?"Undo demo":"Demo issue";return}
      if(action==="hostel-request"){const req={id:"TP-"+Date.now().toString().slice(-6),category:"Hostel support",subject:"Sample hostel support request",status:"Received",date:new Date().toLocaleDateString()};requests.unshift(req);store.set("requests",requests);btn.disabled=true;document.getElementById("hostelMessage").innerHTML='<small class="message ok">Saved locally. Not sent to the university.</small>';return}
      if(action==="next"||action==="previous"||action==="complete"){const r=route(),id=r.id,flow=flows[id];let n=Number(progress[id]||0);if(action==="next")n=Math.min(flow.steps.length-1,n+1);if(action==="previous")n=Math.max(0,n-1);if(action==="complete"){completed=[...new Set([...completed,id])];n=flow.steps.length}progress[id]=n;store.set("completed",completed);store.set("task_progress",progress);render();return}
    }
    const tab=e.target.closest("[data-tab]");if(tab){if(tab.dataset.tab.startsWith("hostel"))document.getElementById("hostelContent").innerHTML=hostelTab(tab.dataset.tab==="hostelRequest"?"hostelRequest":tab.dataset.tab==="hostelNotices"?"hostelNotices":"room");else document.getElementById("examContent").innerHTML=examTab(tab.dataset.tab);tab.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===tab));tab.classList.add("active")}
  });
  app.addEventListener("submit",e=>{
    e.preventDefault();
    if(e.target.id==="loginForm"){const name=new FormData(e.target).get("name").trim();if(name.length<2){document.getElementById("loginMessage").innerHTML='<small class="message error">Enter a display name with at least 2 characters.</small>';return}user={name};menu="";store.set("user",user);location.hash="#dashboard";render()}
    if(e.target.id==="requestForm"){const fd=new FormData(e.target),subject=fd.get("subject").trim(),details=fd.get("details").trim(),out=document.getElementById("requestMessage");if(subject.length<4||details.length<10){out.innerHTML='<small class="message error">Add a subject (at least 4 characters) and details (at least 10 characters).</small>';return}const req={id:"TP-"+Date.now().toString().slice(-6),category:fd.get("category"),subject,status:"Received",date:new Date().toLocaleDateString()};requests.unshift(req);const ok=store.set("requests",requests);out.innerHTML=`<small class="message ${ok?"ok":"error"}">${ok?"Demo request "+req.id+" saved in this browser only. Not sent to the university.":"Could not save this request in browser storage."}</small>`;document.getElementById("requestList")?.replaceChildren();const list=document.getElementById("requestList");if(list)list.innerHTML=requestRows();if(ok){e.target.reset()}}
  });
  window.addEventListener("hashchange",()=>{menu="";searchOpen=false;render()});
  window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();searchOpen=true;render();document.getElementById("globalSearch")?.focus()}if(e.key==="Escape"){searchOpen=false;menu="";render()}});
  render();
})();
</script>
</body>
</html>
